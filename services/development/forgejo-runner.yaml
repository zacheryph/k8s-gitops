# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/namespace.json
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
    namespace: flux-system
  values:
    forgejo:
      url: http://forgejo-http.development.svc.cluster.local:3000
      existingSecret: forgejo-runner-registration

    image:
      repository: registry.erwanleboucher.dev/eleboucher/runner
      tag: 12.13.0@sha256:b71959782cea9cbc86eaeb47e5ba32bf8179fbd117dd849e001c9a13807b1a07

    runnerConfig: |
      cache:
        enabled: true
        dir: /data/cache
        port: 8088
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo-runner
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance,app.kubernetes.io/instance=env-$${ENV_ID}"
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
      runner:
        capacity: 2
        labels:
          - ubuntu-latest:k8s:/config/podspec-default.yaml
          - default:k8s:/config/podspec-default.yaml

          # Image builds: job runs inside a privileged buildah image
          # (overlay storage + user namespaces need it on k0s). Opt in
          # per-workflow with runs-on: buildah.
          - buildah:k8s:/config/podspec-buildah.yaml

          # Image builds (unprivileged): kaniko executor debug image. Opt in
          # per-workflow with runs-on: kaniko. No daemon, no host privileges —
          # build via /kaniko/executor --dockerfile ... --destination ...
          - kaniko:k8s:/config/podspec-kaniko.yaml
        timeout: 3h
        shutdown_timeout: 3m

    podSpecs:
      podspec-default.yaml: |-
        containers:
          - name: main
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:d3f142f768c72e6f54443a07275889ee5b6c1e6560613be12a903744d6835c53
            imagePullPolicy: IfNotPresent
            env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        restartPolicy: Never

      podspec-buildah.yaml: |-
        containers:
          - name: main
            image: quay.io/buildah/stable:v1.43.2@sha256:66ae2a9db044cef93079bb6891115c79c771f0e747e2e97c6d618e3db832b708
            imagePullPolicy: IfNotPresent
            securityContext:
              privileged: true
            env:
              - name: BUILDAH_ISOLATION
                value: chroot
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi
        restartPolicy: Never

      podspec-kaniko.yaml: |-
        containers:
          - name: main
            image: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
            imagePullPolicy: IfNotPresent
            command: ["/busybox/sleep", "infinity"]
            env:
              - name: DOCKER_CONFIG
                value: /kaniko/.docker
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi
        restartPolicy: Never

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
