---
# Credentials synced from 1Password (item "openclaw") via External Secrets
# Operator and the onepassword ClusterSecretStore. The secretKey names are the
# env var names referenced by the OpenClaw config below.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openclaw-api-keys
    creationPolicy: Owner
  data:
    # Model provider: OpenRouter (one key, models referenced as openrouter/<provider>/<model>)
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: openclaw/openrouter_api_key
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: openclaw/slack_bot_token
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: openclaw/slack_app_token
    # Gateway shared secret (auth mode: token) for the Control UI and the
    # native desktop/mobile apps. Generate with
    # `openclaw doctor --generate-gateway-token` (or any long random string)
    # and store in 1Password item "openclaw", field "gateway_token".
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: openclaw/gateway_token
---
apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: openclaw
spec:
  # Pinned app image (operator defaults to :latest). Bump tag+digest together.
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: "2026.9.5"
    digest: sha256:ea298b62be8955d3ef750e2004a610dd90c3a30e5f9886e5d654d78a0c573218
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  config:
    # merge = operator config deep-merges with the PVC config on restart, so the
    # instance's self-edits survive pod restarts. forcePaths re-imposes the
    # owner-only access policy from the CR on every restart, so self-edits can
    # never open DMs, group channels, or owner commands up, or hand out
    # plugin trust (external plugins run in-process as trusted code and can
    # be self-installed via the gateway's plugins API).
    mergeMode: merge
    forcePaths:
      - channels
      - commands
      - plugins
      - hooks
    raw:
      agents:
        defaults:
          # OpenRouter provider (OPENROUTER_API_KEY from the Secret above).
          model:
            primary: openrouter/xiaomi/mimo-v2.6-pro
          models:
            openrouter/openai/gpt-6-luna: {}
            openrouter/xiaomi/mimo-v2.6-pro: {}
            openrouter/xiaomi/mimo-v2.6-flash: {}
            openrouter/typesafe/jev-1.13: {}
            openrouter/qwen/qwen3.8-omni-flash: {}
            openrouter/z-ai/glm-5.3: {}
            openrouter/z-ai/glm-5.3-flash: {}
      # Slack via Socket Mode (outbound WSS only). Tokens are referenced from
      # the env vars supplied by the openclaw-api-keys Secret (1Password, via
      # the ExternalSecret above).
      channels:
        slack:
          enabled: true
          mode: socket
          appToken:
            source: env
            provider: default
            id: SLACK_APP_TOKEN
          botToken:
            source: env
            provider: default
            id: SLACK_BOT_TOKEN
          slashCommand:
            enabled: true
            name: openclaw
          # Respond only to the owner: DMs are allowlisted to a single sender
          # and no group channels are admitted.
          dmPolicy: allowlist
          allowFrom:
            - slack:${OPENCLAW_OWNER_SLACK_ID}
          groupPolicy: allowlist
      commands:
        ownerAllowFrom:
          - slack:${OPENCLAW_OWNER_SLACK_ID}
      # Slack ships as an external plugin: channels.slack configures it, but it
      # stays inert until the plugin is explicitly trusted. The gateway's
      # runtime auto-enable is ephemeral (never written to config), so pin the
      # trust here. `plugins` is in forcePaths above, so the instance cannot
      # self-grant trust to plugins it installs.
      plugins:
        enabled: true
        entries:
          slack:
            enabled: true
      gateway:
        controlUi:
          # Required for non-loopback deployments: the browser Control UI is
          # loaded from a public hostname.
          allowedOrigins:
            - https://openclaw.${CLUSTER_DOMAIN}
      hooks:
        # Inbound webhooks (POST /hooks/...). The hook token is the only auth
        # external senders get — keep it distinct from the gateway token (the
        # openclaw security audit flags reuse). hooks.token has no
        # SecretRef/env source upstream, so it is substituted from
        # cluster-secrets (SOPS). Set OPENCLAW_HOOKS_TOKEN before merging.
        enabled: true
        token: "${OPENCLAW_HOOKS_TOKEN}"
        path: "/hooks"
        allowedAgentIds:
          - main
  # The instance edits itself: install skills, patch config, add env vars, and
  # seed workspace files via OpenClawSelfConfig. The operator validates every
  # request against this allowlist (empty allowlist = nothing allowed; protected
  # keys like gateway config and operator-managed env are always rejected) and
  # grants the pod a scoped service-account token for the K8s API. Combined with
  # mergeMode: merge above, self-edits persist across pod restarts.
  selfConfigure:
    enabled: true
    allowedActions:
      - skills
      - config
      - envVars
      - workspaceFiles
  # Gateway proxy (nginx) — digest-pinned. Raw TCP proxy, no auth of its own.
  gateway:
    image:
      tag: "1.27-alpine"
      digest: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
  security:
    networkPolicy:
      # No same-namespace ingress to the gateway/canvas ports; the Slack path
      # is outbound-only. External traffic (Control UI, native apps, webhooks)
      # arrives only via Envoy in the gateway namespace, through the HTTPRoute
      # below.
      allowSameNamespaceIngress: false
      allowedIngressNamespaces:
        - gateway
  observability:
    metrics:
      # Bootstrap scope: drops the unauthenticated metrics port and the OTel
      # sidecar. Re-enable with networking.metricsIngress.from: AllowedPeers.
      enabled: false
  storage:
    persistence:
      enabled: true
      size: 10Gi
---
# Public exposure for inbound webhooks, the native desktop/mobile apps, and the
# browser Control UI.
#
# Deliberately NOT labeled cluster.routine.sh/oidc-credentials: the
# Kyverno-generated Envoy OIDC SecurityPolicy is browser-redirect auth and would
# 302 both WebSocket upgrades from the native apps and webhook POSTs from
# external senders. Access is enforced by OpenClaw itself instead — gateway
# token + per-device pairing (apps, Control UI) and the dedicated hooks token
# (webhooks). The canvas/preview port stays unrouted.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openclaw
  namespace: automation
  annotations:
    dns.routine.sh/external: "true"
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames:
    - "openclaw.${CLUSTER_DOMAIN}"
  rules:
    - backendRefs:
        - name: openclaw
          port: 18789
