---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 12h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2.11.0
  url: oci://ghcr.io/external-secrets/charts/external-secrets
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name external-secrets
  namespace: *name
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: external-secrets
  values:
    installCRDs: true
    serviceMonitor:
      enabled: true
    # only the read path is used (ClusterSecretStore + ExternalSecret);
    # disable unused cluster-wide reconcilers and their RBAC surface
    processClusterExternalSecret: false
    processClusterGenerator: false
    processClusterPushSecret: false
    processPushSecret: false
    rbac:
      serviceAccountTokenCreate: false
      servicebindings:
        create: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/secret.json
apiVersion: v1
kind: Secret
metadata:
  # 1Password service account token, set via:
  #   scripts/cluster-secrets set ONEPASSWORD_SA_TOKEN
  name: onepassword-service-account
  namespace: external-secrets
type: Opaque
stringData:
  token: ${ONEPASSWORD_SA_TOKEN}
