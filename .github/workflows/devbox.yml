name: devbox

on:
  push:
    branches: [main]
    paths:
      - "images/devbox/**"
      - ".github/workflows/devbox.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: devbox
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devbox

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/devbox
          load: true
          tags: devbox:test
          cache-from: type=gha,scope=devbox
          cache-to: type=gha,scope=devbox,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash devbox:test -lc '
            set -e
            for c in node bun go uv mise gh kubectl helm flux sops yq pi claude codex bb git rg fd jq; do
              command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }
            done
            go version && helm version --short && node --version'
          docker run -d --name devbox -p 38886:38886 -e BB_APP_URL=https://bb.example.test devbox:test
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:38886/health && exit 0
            sleep 2
          done
          docker logs devbox
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/devbox
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=devbox

      - name: Open PR to update the bb image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
          BRANCH: chore/devbox-${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          git config user.name "hermes-release-bot"
          git config user.email "zacheryph+hermes@gmail.com"
          git checkout -b "${BRANCH}"
          sed -i \
            "s|tag: sha-.*@sha256:.*|tag: sha-${SHA}@${DIGEST}|" \
            services/development/bb.yaml
          git add services/development/bb.yaml
          git commit -m "chore(deps): update devbox to sha-${SHORT_SHA}"
          git push origin "${BRANCH}"
          gh pr create \
            --base main --head "${BRANCH}" \
            --title "chore(deps): update devbox to sha-${SHORT_SHA}" \
            --body "Automated image bump from the \`devbox\` workflow (commit ${SHORT_SHA}, digest \`${DIGEST}\`)."
